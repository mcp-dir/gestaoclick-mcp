# Smithery configuration for GestãoClick
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_gestaoclick

name: gestaoclick-mcp
displayName: "GestãoClick"
description: >
  ERP GestãoClick (sistema de gestão para PMEs) via API oficial: clientes, fornecedores, produtos e serviços, orçamentos, vendas, ordens de serviço, compras, notas fiscais (produto, consumidor, serviço) e financeiro (pagamentos, recebimentos, contas bancárias, planos de contas, centros de custos). Gere o par de chaves no painel em Meus aplicativos, API.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/gestaoclick-mcp
repository: https://github.com/mcp-dir/gestaoclick-mcp

tags:
  - gestaoclick
  - brazil
  - fin
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_gestaoclick

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_gestaoclick/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
